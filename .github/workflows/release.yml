name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.releases_created }}
      # Manifest mode prefixes every per-package output with the package path,
      # which contains a '/', so these need bracket syntax rather than dot
      # access. This is the easiest thing in the file to get wrong.
      tag: ${{ steps.rp.outputs['mdm/clamav--tag_name'] }}
      version: ${{ steps.rp.outputs['mdm/clamav--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: >-
      needs.release-please.outputs.released == 'true' &&
      needs.release-please.outputs.tag != ''
    runs-on: macos-15
    # Notarization waits on Apple and routinely takes 15+ minutes.
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Cache upstream artifacts
        uses: actions/cache@v4
        with:
          path: mdm/clamav/.cache
          key: clamav-artifacts-${{ hashFiles('mdm/clamav/versions.env') }}

      - name: Set up a throwaway signing keychain
        env:
          # A repository VARIABLE, not a secret. It is not sensitive -- it is
          # embedded in every signed artifact and readable with `codesign -d` on
          # any distributed pkg -- and registering it as a secret makes GitHub
          # redact it from logs, which corrupts the designated-requirement string
          # in the build summary. That string is the reason the summary exists.
          # A variable keeps it out of the repo just as well.
          TEAM_ID: ${{ vars.TEAM_ID }}
          DEVID_APP_P12_BASE64: ${{ secrets.DEVID_APP_P12_BASE64 }}
          DEVID_APP_P12_PASSWORD: ${{ secrets.DEVID_APP_P12_PASSWORD }}
          DEVID_INSTALLER_P12_BASE64: ${{ secrets.DEVID_INSTALLER_P12_BASE64 }}
          DEVID_INSTALLER_P12_PASSWORD: ${{ secrets.DEVID_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail

          # Generated per-run rather than stored, so this is one less secret to
          # provision and rotate. Masked before first use so it cannot surface in
          # a log line, and deliberately NOT exported to $GITHUB_ENV: nothing
          # later needs it (delete-keychain does not take a password), and
          # exporting would put it in the environment of every subsequent step
          # for no reason.
          PW="$(uuidgen)"
          echo "::add-mask::$PW"

          KC="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN=$KC" >> "$GITHUB_ENV"

          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"

          # --decode rather than -d: portable across BSD (macOS) and GNU base64.
          printf '%s' "$DEVID_APP_P12_BASE64"       | base64 --decode > "$RUNNER_TEMP/app.p12"
          printf '%s' "$DEVID_INSTALLER_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/inst.p12"

          # Imported separately because the two exports carry their own
          # passwords. `security import` reports success on a wrong password in
          # some cases, so the identity count is asserted below rather than
          # trusting these to have worked.
          security import "$RUNNER_TEMP/app.p12" -k "$KC" -P "$DEVID_APP_P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security import "$RUNNER_TEMP/inst.p12" -k "$KC" -P "$DEVID_INSTALLER_P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign

          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/inst.p12"

          # Without this, codesign blocks on an interactive keychain prompt that
          # can never be answered on a runner.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$PW" "$KC" >/dev/null

          # The build script finds its identities with `security find-identity`,
          # which only searches the keychain search list -- so ours must be on it.
          # Intentionally unquoted: the existing list is splatted as arguments.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')

          security find-identity -v | sed 's/^/  /'

          # Fail here, not 20 minutes into a notarization wait. A wrong password
          # or a .p12 exported without its private key both surface as a missing
          # identity, and the build's own preflight would otherwise be the first
          # thing to notice.
          for t in 'Developer ID Application' 'Developer ID Installer'; do
            if ! security find-identity -v "$KC" | grep -q "$t: .*(${TEAM_ID})"; then
              echo "::error::'$t' for team ${TEAM_ID} not in the keychain after import." \
                   "Check the matching *_P12_BASE64 and *_P12_PASSWORD secrets," \
                   "and that the .p12 was exported with its private key."
              exit 1
            fi
          done

      - name: Write the notarization API key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"

      - name: Build, sign, notarize, staple
        working-directory: mdm/clamav
        env:
          # A repository VARIABLE, not a secret. It is not sensitive -- it is
          # embedded in every signed artifact and readable with `codesign -d` on
          # any distributed pkg -- and registering it as a secret makes GitHub
          # redact it from logs, which corrupts the designated-requirement string
          # in the build summary. That string is the reason the summary exists.
          # A variable keeps it out of the repo just as well.
          TEAM_ID: ${{ vars.TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build-clamav-suite.sh \
            --notary-key "$RUNNER_TEMP/notary.p8" \
            --notary-key-id "$NOTARY_KEY_ID" \
            --notary-issuer "$NOTARY_ISSUER"

      - name: Attach the package to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" mdm/clamav/out/*.pkg --clobber

      - name: Tear down the keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"
